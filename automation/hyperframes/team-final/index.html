<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <script src="CustomEase.min.js"></script>
    <script src="motion.js"></script>
    <script src="names.js"></script>
    <script src="match.js"></script>
    <link rel="stylesheet" href="base.css" />
    <style>
      #panel .fill { background: linear-gradient(180deg, rgba(5,8,6,0.93) 0%, rgba(6,9,7,0.88) 55%, rgba(5,8,6,0.94) 100%); }

      #title { position: absolute; top: 78px; left: 0; right: 0; height: 104px; display: flex; justify-content: center; }
      #title span { font-weight: 800; font-size: 100px; line-height: 104px; letter-spacing: 0.1em; padding-left: 0.1em; }

      /* Score table: two open rows on hairlines (no boxes) */
      #heads { position: absolute; top: 246px; left: 0; width: 1920px; height: 30px; }
      #heads .mask { position: absolute; width: 130px; margin-left: -65px; height: 30px; text-align: center; }
      #heads span { font-weight: 700; font-size: 24px; line-height: 30px; letter-spacing: 0.14em; padding-left: 0.14em; color: var(--muted); }
      .hl { position: absolute; left: 310px; width: 1300px; height: 2px; background: var(--hair); transform-origin: 0 50%; }
      #hl0 { top: 288px; } #hl1 { top: 406px; } #hl2 { top: 524px; }
      .row { position: absolute; left: 310px; width: 1300px; height: 116px; }
      #row1 { top: 290px; }
      #row2 { top: 408px; }
      .row .tint { position: absolute; inset: 0; opacity: 0; }
      #row1 .tint { background: linear-gradient(90deg, rgba(112,213,73,0.24) 0%, rgba(112,213,73,0.08) 55%, rgba(112,213,73,0) 100%); }
      #row2 .tint { background: linear-gradient(90deg, rgba(107,189,255,0.24) 0%, rgba(107,189,255,0.08) 55%, rgba(107,189,255,0) 100%); }
      .row .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; transform-origin: 50% 50%; }
      #row1 .bar { background: var(--team); }
      #row2 .bar { background: var(--opp); }
      .mini { position: absolute; left: 34px; top: 12px; width: 92px; height: 92px; }
      .mini svg { position: absolute; inset: 0; overflow: visible; }
      .mini .disc { position: absolute; inset: 7px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #0d110f; }
      .mini .mono { width: 84%; height: 84%; object-fit: contain; display: block; }
      .mini .genericWrap { width: 64%; height: 64%; }
      .mini .generic { width: 100%; height: 100%; display: block; overflow: visible; }
      .names { position: absolute; left: 150px; top: 0; height: 116px; display: flex; flex-direction: column; justify-content: center; }
      .names .club span { font-weight: 800; font-size: 54px; line-height: 1.04; text-transform: uppercase; letter-spacing: 0.015em; white-space: nowrap; }
      .names .team span { font-weight: 700; font-size: 29px; line-height: 1.2; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; color: var(--soft); }
      .cell { position: absolute; top: 0; height: 116px; overflow: hidden; }
      .cell span { position: absolute; left: 0; right: 0; top: 0; height: 116px; display: grid; place-items: center; line-height: 1; }
      .score { width: 120px; margin-left: -60px; }
      .score span { font-weight: 700; font-size: 64px; }
      .sets { width: 140px; margin-left: -70px; }
      .sets span { font-weight: 800; font-size: 92px; }
      .vline { position: absolute; top: 26px; bottom: 26px; width: 2px; background: var(--hair); }

      #result { position: absolute; top: 570px; left: 0; right: 0; height: 72px; display: flex; justify-content: center; }
      #result span { font-weight: 800; font-size: 58px; line-height: 72px; letter-spacing: 0.04em; white-space: nowrap; text-transform: uppercase; }

      /* Stats: one open band, four columns split by hairlines */
      #tiles { position: absolute; top: 690px; left: 340px; width: 1240px; height: 124px; display: flex; }
      .tile { position: relative; flex: 1; text-align: center; }
      .tile + .tile::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 2px; background: var(--hair); transform: scaleY(var(--sy, 0)); }
      .tile .lab { height: 28px; }
      .tile .lab span { font-weight: 700; font-size: 24px; line-height: 28px; letter-spacing: 0.14em; padding-left: 0.14em; color: var(--muted); }
      .tile .val { margin-top: 18px; height: 70px; }
      .tile .val > span { display: flex; justify-content: center; align-items: baseline; gap: 10px; white-space: nowrap; }
      .tile .val b { font-weight: 800; font-size: 66px; line-height: 70px; }
      .tile .val em { font-style: normal; font-weight: 800; font-size: 32px; letter-spacing: 0.05em; text-transform: uppercase; }

      #infoRule { position: absolute; left: 460px; top: 866px; width: 1000px; height: 2px; background: rgba(242,244,241,0.22); }
      #info { position: absolute; left: 0; right: 0; top: 888px; height: 52px; display: flex; justify-content: center; align-items: center; gap: 26px;
        font-weight: 700; font-size: 36px; line-height: 52px; letter-spacing: 0.1em; white-space: nowrap; }
      #info .mask { height: 52px; }
      #info .dot { width: 8px; height: 8px; background: rgba(242,244,241,0.4); transform: rotate(45deg); }
      #info .muted { color: var(--soft); }
      #info .hl2 { color: var(--team); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.9" data-width="3840" data-height="2160">
      <div id="scene" class="clip" data-start="0" data-duration="6.9" data-track-index="0">
        <div id="plate"></div>
        <div id="panel"><div class="fill"></div>
          <div id="stage">
            <div id="title" class="mask"><span>FINAL</span></div>

            <div id="heads"></div>
            <div class="hl" id="hl0"></div><div class="hl" id="hl1"></div><div class="hl" id="hl2"></div>
            <div class="row" id="row1">
              <div class="tint"></div><div class="bar"></div>
              <div class="mini"><svg viewBox="0 0 92 92"><circle class="ring" cx="46" cy="46" r="43" fill="none" stroke="#70d549" stroke-width="4" transform="rotate(-90 46 46)" /></svg><div class="disc"></div></div>
              <div class="names"><div class="club mask"><span></span></div><div class="team mask"><span></span></div></div>
            </div>
            <div class="row" id="row2">
              <div class="tint"></div><div class="bar"></div>
              <div class="mini"><svg viewBox="0 0 92 92"><circle class="ring" cx="46" cy="46" r="43" fill="none" stroke="#6bbdff" stroke-width="4" transform="rotate(-90 46 46)" /></svg><div class="disc"></div></div>
              <div class="names"><div class="club mask"><span></span></div><div class="team mask"><span></span></div></div>
            </div>

            <div id="result" class="mask"><span></span></div>
            <div id="tiles"></div>

            <div id="infoRule"></div>
            <div id="info">
              <div class="mask"><span class="muted" id="iDate"></span></div>
              <span class="dot"></span>
              <div class="mask"><span class="hl2" id="iFormat"></span></div>
              <span class="dot"></span>
              <div class="mask"><span class="muted" id="iDetail"></span></div>
            </div>
          </div>
        </div>
        <div id="edges"><div class="edge lead b"></div><div class="edge lead a"></div></div>
        <span id="measure"></span><span id="measure2"></span>
      </div>
    </div>
    <script src="plate.js"></script>

    <script>
      // Match data comes from match.js (written by the workflow for each match) - same fields as before.
      const V = window.VNames, M = window.MATCH, DASH = "–";
      const GENERIC_BALL = (() => {
        const seam = "M0 0 C 0 -45 35 -78 70 -71", par = "M-30 -17 C -34 -60 0 -97 30 -95";
        const g = [0, 120, 240].map(a => `<g transform="rotate(${a})"><path d="${seam}"/><path d="${par}"/></g>`).join("");
        return `<div class="mono genericWrap"><svg class="generic" viewBox="-115 -115 230 230" fill="none" stroke="#6bbdff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><circle r="100"/>${g}</svg></div>`;
      })();

      // up to 8 sets fit (scrimmages); 1-3 sets keep the wide columns
      const nSets = Math.max(1, Math.min(8, M.sets.length));
      const ROW_L = 310, SETS_X = 1530;
      const COL_W = nSets <= 3 ? 120 : Math.max(84, Math.min(120, Math.floor(400 / (nSets - 1))));
      const COL_STEP_T = nSets <= 3 ? 0.24 : 0.48 / (nSets - 1);
      const colX = i => 1385 - (nSets - 1 - i) * COL_W;
      const parts = [V.splitName(M.team1.name, M), V.splitName(M.team2.name, M)];
      const teamCol = ["#70d549", "#6bbdff"];

      [["iDate", M.date], ["iFormat", M.format], ["iDetail", M.detail]].forEach(([id, v]) => {
        const el = document.getElementById(id); el.textContent = v || "";
        if (!v) { el.parentElement.style.display = "none"; const d = el.parentElement.previousElementSibling; if (d && d.classList.contains("dot")) d.style.display = "none"; }
      });

      const heads = document.getElementById("heads");
      for (let i = 0; i < nSets; i++) heads.insertAdjacentHTML("beforeend", `<div class="mask" style="left:${colX(i)}px"><span>SET ${i + 1}</span></div>`);
      heads.insertAdjacentHTML("beforeend", `<div class="mask" style="left:${SETS_X}px"><span>SETS</span></div>`);

      [["row1", M.team1, 0], ["row2", M.team2, 1]].forEach(([id, t, k]) => {
        const row = document.getElementById(id);
        row.querySelector(".disc").innerHTML = t.logo ? `<img class="mono" src="${t.logo}" alt="" />` : GENERIC_BALL;
        row.querySelector(".club span").textContent = parts[k].top;
        row.querySelector(".team span").textContent = parts[k].bottom;
        if (!parts[k].bottom) row.querySelector(".team").style.display = "none";
        for (let i = 0; i < nSets; i++) {
          const [a, b] = M.sets[i]; const mine = k ? b : a, theirs = k ? a : b;
          const c = document.createElement("div");
          c.className = "cell score"; c.dataset.col = i; c.dataset.win = mine > theirs ? 1 : 0;
          c.style.left = (colX(i) - ROW_L) + "px"; c.innerHTML = `<span data-to="${mine}">0</span>`;
          if (nSets >= 6) { c.style.width = COL_W + "px"; c.style.marginLeft = (-COL_W / 2) + "px"; c.firstChild.style.fontSize = "56px"; }
          row.appendChild(c);
        }
        row.insertAdjacentHTML("beforeend", `<div class="vline" style="left:${(colX(nSets - 1) + SETS_X) / 2 - ROW_L}px"></div>`);
        row.insertAdjacentHTML("beforeend", `<div class="cell sets" style="left:${SETS_X - ROW_L}px"><span>${M.won[k]}</span></div>`);
      });

      const winName = M.winner ? V.fullName(parts[M.winner - 1]) : "";
      let resTxt;
      if (!M.winner) resTxt = `MATCH TIED ${M.won[0]}${DASH}${M.won[1]}`;
      else if (M.decidedBy === "points") resTxt = `${winName} WIN ON POINTS ${Math.max(...M.total)}${DASH}${Math.min(...M.total)}`;
      else resTxt = `${winName} WIN ${Math.max(...M.won)}${DASH}${Math.min(...M.won)}`;
      const res = document.querySelector("#result span");
      res.textContent = resTxt; res.style.color = M.winner ? teamCol[M.winner - 1] : "var(--paper)";

      const label = k => k === 0 ? ["EACH", "#f2f4f1"] : (k === 1 ? [V.teamWord(parts[0]), teamCol[0]] : ["OPP", teamCol[1]]);
      const tiles = [
        ["TOTAL POINTS", `<b class="cnt" data-to="${M.total[0]}">0</b><b>${DASH}</b><b class="cnt" data-to="${M.total[1]}">0</b>`],
        ["LONGEST RUN", `<b class="cnt" data-to="${M.run[1]}">0</b>` + (M.run[1] ? `<em style="color:${label(M.run[0])[1]}">${label(M.run[0])[0]}</em>` : "")],
        ["BIGGEST LEAD", `<b>+</b><b class="cnt" data-to="${M.lead[1]}" style="margin-left:-12px">0</b>` + (M.lead[1] ? `<em style="color:${label(M.lead[0])[1]}">${label(M.lead[0])[0]}</em>` : "")],
        ["MATCH TIME", `<b>${M.matchTime}</b>`]
      ];
      const tilesEl = document.getElementById("tiles");
      tiles.forEach(([lab, val]) => tilesEl.insertAdjacentHTML("beforeend",
        `<div class="tile"><div class="lab mask"><span>${lab}</span></div><div class="val mask"><span>${val}</span></div></div>`));

      // Timing contract with hf-bookends.py (unchanged): 6.9 s of motion, the workflow holds the last frame.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      VM.init();

      Promise.all([
        document.fonts.load('800 62px "Barlow Condensed"'),
        document.fonts.load('700 34px "Barlow Condensed"')
      ]).catch(() => {}).then(build);

      function build() {
        const nameMax = colX(0) - COL_W / 2 - 30 - (ROW_L + 150);
        const subFit = [];
        [["row1", 0], ["row2", 1]].forEach(([id, k]) => {
          const L = V.layoutTop(parts[k].top, { maxw: nameMax, oneMax: 54, oneMin: 40, twoMax: 40, twoMin: 28 });
          const span = document.getElementById(id).querySelector(".club span");
          span.textContent = "";
          L.lines.forEach((ln, i) => { if (i) span.appendChild(document.createElement("br")); span.appendChild(document.createTextNode(ln)); });
          span.style.fontSize = L.size + "px";
          if (parts[k].bottom) subFit.push(V.largestSize([parts[k].bottom], 29, 20, true, nameMax) || 20);
        });
        const subSize = subFit.length ? Math.min(...subFit) : 29;
        document.querySelectorAll(".names .team span").forEach(s => s.style.fontSize = subSize + "px");
        const rw = res.getBoundingClientRect().width / (document.documentElement.classList.contains("preview") ? 1 : 2);
        if (rw > 1300) res.style.fontSize = Math.floor(58 * 1300 / rw) + "px";

        const OUT = VM.OUT, C = 2 * Math.PI * 43;
        const rows = [document.getElementById("row1"), document.getElementById("row2")];

        gsap.set(".mask > span", { yPercent: 108 });
        gsap.set(".hl", { scaleX: 0 });
        gsap.set(".ring", { attr: { "stroke-dasharray": C, "stroke-dashoffset": C } });
        gsap.set(".mini .disc", { scale: 0.8, opacity: 0 });
        gsap.set(".row .bar", { scaleY: 0 });
        gsap.set(".score span", { opacity: 0, y: 14 });
        gsap.set(".sets span", { yPercent: 100 });
        gsap.set(".vline", { scaleY: 0 });
        gsap.set("#infoRule", { scaleX: 0 });
        gsap.set("#info .dot", { scale: 0, rotation: 45 });

        // Beat 1 - panel + title
        VM.panelIn(tl, 0, 1.0);
        tl.to("#title span", { yPercent: 0, duration: 0.85, ease: OUT }, 0.62);

        // Beat 2 - the table draws itself: hairlines, badges, names, headers
        tl.to(".hl", { scaleX: 1, duration: 0.9, ease: OUT, stagger: 0.08 }, 1.05)
          .to(".mini .disc", { scale: 1, opacity: 1, duration: 0.8, ease: OUT, stagger: 0.1 }, 1.2)
          .to(".ring", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: OUT, stagger: 0.1 }, 1.22)
          .to(".club span", { yPercent: 0, duration: 0.75, ease: OUT, stagger: 0.1 }, 1.3)
          .to(".team span", { yPercent: 0, duration: 0.75, ease: OUT, stagger: 0.1 }, 1.4)
          .to("#heads span", { yPercent: 0, duration: 0.6, ease: OUT, stagger: 0.06 }, 1.5)
          .to(".vline", { scaleY: 1, duration: 0.6, ease: OUT }, 1.7);

        // Set scores rise in and count up column by column; the losing score dims
        const T0 = 2.0;
        for (let i = 0; i < nSets; i++) {
          const at = T0 + i * COL_STEP_T;
          const cells = Array.from(document.querySelectorAll(".score")).filter(el => +el.dataset.col === i);
          tl.to(cells.map(c => c.querySelector("span")), { opacity: 1, y: 0, duration: 0.5, ease: OUT }, at);
          cells.forEach(c => VM.count(tl, c.querySelector("span"), at, 0.9));
          cells.filter(c => c.dataset.win === "0").forEach(c => tl.to(c.querySelector("span"), { color: "rgba(242,244,241,0.36)", duration: 0.4, ease: VM.SOFT }, at + 0.8));
        }
        const tEnd = T0 + (nSets - 1) * COL_STEP_T + 0.9;        // 3.38 s for 3 sets
        const setsSpans = Array.from(document.querySelectorAll(".sets span"));
        tl.to(setsSpans, { yPercent: 0, duration: 0.6, ease: OUT, stagger: 0.06 }, tEnd - 0.1);

        // Winner: colour bar, soft wash across the row, sets-won number in the team colour
        if (M.winner) {
          const w = M.winner, wr = rows[w - 1];
          tl.to(wr.querySelector(".bar"), { scaleY: 1, duration: 0.6, ease: OUT }, tEnd + 0.3)
            .fromTo(wr.querySelector(".tint"), { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: OUT }, tEnd + 0.3)
            .to(setsSpans[w - 1], { color: teamCol[w - 1], duration: 0.4, ease: VM.SOFT }, tEnd + 0.35)
            .to(setsSpans[2 - w], { color: "rgba(242,244,241,0.36)", duration: 0.4, ease: VM.SOFT }, tEnd + 0.35);
        }

        // Beat 3 - result, stats, match details
        const b3 = tEnd + 0.7;
        tl.to("#result span", { yPercent: 0, duration: 0.85, ease: OUT }, b3)
          .to(".tile .lab span", { yPercent: 0, duration: 0.7, ease: OUT, stagger: 0.07 }, b3 + 0.35)
          .to(".tile .val > span", { yPercent: 0, duration: 0.8, ease: OUT, stagger: 0.07 }, b3 + 0.42)
          .to(".tile", { "--sy": 1, duration: 0.6, ease: OUT, stagger: 0.07 }, b3 + 0.4)
          .to("#infoRule", { scaleX: 1, duration: 0.8, ease: OUT }, b3 + 0.8)
          .to("#info .mask > span", { yPercent: 0, duration: 0.7, ease: OUT, stagger: 0.08 }, b3 + 0.9)
          .to("#info .dot", { scale: 1, duration: 0.4, ease: OUT, stagger: 0.08 }, b3 + 1.0);
        document.querySelectorAll(".tile").forEach((tile, i) =>
          tile.querySelectorAll(".cnt").forEach(el => VM.count(tl, el, b3 + 0.42 + i * 0.07, 1.0)));

        tl.to({}, { duration: 0.01 }, 6.89);
        tl.seek(0); window.__ready = true; window.__lastMove = b3 + 1.9;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
    </script>
  </body>
</html>
