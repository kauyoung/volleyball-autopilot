<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <script src="CustomEase.min.js"></script>
    <script src="motion.js"></script>
    <script src="names.js"></script>
    <script src="match.js"></script>
    <link rel="stylesheet" href="base.css" />
    <style>
      #panel .fill { background: linear-gradient(180deg, rgba(5,8,6,0.90) 0%, rgba(6,9,7,0.84) 55%, rgba(5,8,6,0.92) 100%); }

      /* Header */
      #kicker { position: absolute; top: 86px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 30px; }
      #kicker .rule { width: 190px; height: 2px; background: rgba(242,244,241,0.30); }
      #kicker .rule.l { transform-origin: 100% 50%; }
      #kicker .rule.r { transform-origin: 0% 50%; }
      #kicker .txt { font-weight: 700; font-size: 44px; line-height: 52px; letter-spacing: 0.2em; padding-left: 0.2em; color: var(--soft); }

      /* Teams */
      .team { position: absolute; top: 196px; width: 640px; text-align: center; }
      #teamL { left: 170px; }
      #teamR { right: 170px; }
      .badge { position: relative; width: 360px; height: 360px; margin: 0 auto; }
      .badge svg { position: absolute; inset: 0; overflow: visible; }
      .badge .disc { position: absolute; inset: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #0d110f; }
      .badge .mono { width: 84%; height: 84%; object-fit: contain; display: block; }
      .badge .genericWrap { width: 62%; height: 62%; }
      .badge .generic { width: 100%; height: 100%; display: block; overflow: visible; }
      .name { margin-top: 26px; }
      .name span { font-weight: 800; font-size: 96px; line-height: 1.12; letter-spacing: 0.015em; text-transform: uppercase; white-space: nowrap; }
      .sub { margin-top: 2px; }
      .sub span { font-weight: 700; font-size: 62px; line-height: 1.18; letter-spacing: 0.08em; padding-left: 0.08em; color: var(--soft); text-transform: uppercase; white-space: nowrap; }
      .sub.empty { display: none; }

      /* Centre: one 14-degree line with VS sitting on it */
      #mid { position: absolute; left: 960px; top: 470px; width: 0; height: 0; }
      #midLine { position: absolute; left: -1px; top: -300px; width: 2px; height: 600px; transform: rotate(14deg); }
      #midLine i { position: absolute; left: 0; width: 2px; background: rgba(242,244,241,0.42); }
      #midLine .t { top: 0; height: 205px; transform-origin: 50% 100%; }
      #midLine .b { bottom: 0; height: 205px; transform-origin: 50% 0%; }
      #vs { position: absolute; left: -120px; top: -80px; width: 240px; height: 160px; display: flex; justify-content: center; gap: 4px; }
      #vs .mask { height: 160px; }
      #vs span { font-weight: 800; font-size: 150px; line-height: 160px; letter-spacing: 0.02em; }

      /* Match details */
      #infoRule { position: absolute; left: 460px; top: 838px; width: 1000px; height: 2px; background: rgba(242,244,241,0.22); }
      #info { position: absolute; left: 0; right: 0; top: 860px; height: 60px; display: flex; justify-content: center; align-items: center; gap: 30px;
        font-weight: 700; font-size: 46px; line-height: 60px; letter-spacing: 0.1em; white-space: nowrap; }
      #info .mask { height: 60px; }
      #info .dot { width: 9px; height: 9px; background: rgba(242,244,241,0.4); transform: rotate(45deg); }
      #info .muted { color: var(--soft); }
      #info .hl { color: var(--team); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.9" data-width="3840" data-height="2160">
      <div id="scene" class="clip" data-start="0" data-duration="4.9" data-track-index="0">
        <div id="plate"></div>
        <div id="panel"><div class="fill"></div>
          <div id="stage">

            <div id="kicker">
              <div class="rule l"></div>
              <div class="txt mask"><span id="kTxt">2026–27 SEASON</span></div>
              <div class="rule r"></div>
            </div>

            <div id="teamL" class="team">
              <div class="badge">
                <svg viewBox="0 0 360 360">
                  <circle cx="180" cy="180" r="166" fill="none" stroke="#70d549" stroke-opacity="0.28" stroke-width="2" transform="rotate(-90 180 180)" class="halo" />
                  <circle cx="180" cy="180" r="150" fill="none" stroke="#70d549" stroke-width="8" stroke-linecap="round" transform="rotate(-90 180 180)" class="ring" />
                </svg>
                <div class="disc"></div>
              </div>
              <div class="name mask"><span></span></div>
              <div class="sub mask"><span></span></div>
            </div>

            <div id="teamR" class="team">
              <div class="badge">
                <svg viewBox="0 0 360 360">
                  <circle cx="180" cy="180" r="166" fill="none" stroke="#6bbdff" stroke-opacity="0.28" stroke-width="2" transform="rotate(-90 180 180)" class="halo" />
                  <circle cx="180" cy="180" r="150" fill="none" stroke="#6bbdff" stroke-width="8" stroke-linecap="round" transform="rotate(-90 180 180)" class="ring" />
                </svg>
                <div class="disc"></div>
              </div>
              <div class="name mask"><span></span></div>
              <div class="sub mask"><span></span></div>
            </div>

            <div id="mid">
              <div id="midLine"><i class="t"></i><i class="b"></i></div>
              <div id="vs"><div class="mask"><span class="v">V</span></div><div class="mask"><span class="s">S</span></div></div>
            </div>

            <div id="infoRule"></div>
            <div id="info">
              <div class="mask"><span class="muted" id="iDate"></span></div>
              <span class="dot"></span>
              <div class="mask"><span class="hl" id="iFormat"></span></div>
              <span class="dot"></span>
              <div class="mask"><span class="muted" id="iDetail"></span></div>
            </div>
          </div>
        </div>
        <div id="edges"><div class="edge lead b"></div><div class="edge lead a"></div><div class="edge trail b"></div><div class="edge trail a"></div></div>
        <span id="measure"></span><span id="measure2"></span>
      </div>
    </div>
    <script src="plate.js"></script>

    <script>
      // Match data comes from match.js (written by the workflow for each match) - same fields as before.
      const GENERIC_BALL = (() => {
        const seam = "M0 0 C 0 -45 35 -78 70 -71", par = "M-30 -17 C -34 -60 0 -97 30 -95";
        const g = [0, 120, 240].map(a => `<g transform="rotate(${a})"><path d="${seam}"/><path d="${par}"/></g>`).join("");
        return `<div class="mono genericWrap"><svg class="generic" viewBox="-115 -115 230 230" fill="none" stroke="#6bbdff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle r="100"/>${g}</svg></div>`;
      })();
      const { splitName, layoutTop, largestSize, SUB_MAX, SUB_MIN } = window.VNames;
      const M = window.MATCH;

      function fillTeam(sel, t) {
        const disc = document.querySelector(sel + " .disc");
        if (t.logo) { const img = document.createElement("img"); img.className = "mono"; img.src = t.logo; img.alt = ""; disc.appendChild(img); }
        else disc.insertAdjacentHTML("afterbegin", GENERIC_BALL);
      }
      function layoutTeams() {
        const sides = [["#teamL", M.team1], ["#teamR", M.team2]].map(([sel, t]) => {
          const parts = splitName(t.name, M);
          return { sel, parts, top: layoutTop(parts.top) };
        });
        const subs = sides.filter(x => x.parts.bottom);       // same second-line size on both sides
        const subSize = subs.length ? Math.min(...subs.map(x => largestSize([x.parts.bottom], SUB_MAX, SUB_MIN, true) || SUB_MIN)) : SUB_MAX;
        window.__INTRO_NAMES = sides.map(x => ({ top: x.top.lines.join(" / "), bottom: x.parts.bottom, how: x.parts.how }));
        sides.forEach(x => {
          const span = document.querySelector(x.sel + " .name span");
          span.textContent = "";
          x.top.lines.forEach((ln, i) => { if (i) span.appendChild(document.createElement("br")); span.appendChild(document.createTextNode(ln)); });
          span.style.fontSize = x.top.size + "px";
          if (x.top.lines.length > 1) span.style.lineHeight = "1.04";
          const sub = document.querySelector(x.sel + " .sub");
          sub.querySelector("span").textContent = x.parts.bottom;
          sub.querySelector("span").style.fontSize = subSize + "px";
          if (!x.parts.bottom) sub.classList.add("empty");
        });
      }

      fillTeam("#teamL", M.team1);
      fillTeam("#teamR", M.team2);
      [["iDate", M.date], ["iFormat", M.format], ["iDetail", M.detail]].forEach(([id, v]) => {
        const el = document.getElementById(id); el.textContent = v || "";
        if (!v) { el.parentElement.style.display = "none"; const d = el.parentElement.previousElementSibling; if (d && d.classList.contains("dot")) d.style.display = "none"; }
      });
      // "2026–27" from the workflow is shown as the full years: "2026–2027 SEASON"
      const fullSeason = t => String(t).replace(/^(\d{2})(\d{2})\s*[–-]\s*(\d{2})$/, (m, c, a, b) => c + a + "–" + (+b < +a ? +c + 1 : c) + b);
      if (M.season) document.getElementById("kTxt").textContent = fullSeason(M.season) + " SEASON";

      // Timing contract with hf-bookends.py (unchanged): everything has landed by 3.145 s,
      // 3.145-3.195 s is the still frame the workflow repeats for the hold, exit ends by 4.9 s.
      const BUILD_S = 3.145, HOLD_S = 0.05, EXIT = BUILD_S + HOLD_S, END = 4.9;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      VM.init();

      Promise.all([
        document.fonts.load('800 96px "Barlow Condensed"'),
        document.fonts.load('700 50px "Barlow Condensed"')
      ]).catch(() => {}).then(build);

      function build() {
        layoutTeams();
        const OUT = VM.OUT, IN = VM.IN;
        const C = 2 * Math.PI * 150, C2 = 2 * Math.PI * 166;

        gsap.set("#kicker .rule, #infoRule", { scaleX: 0 });
        gsap.set(".mask > span", { yPercent: 108 });
        gsap.set(".ring", { attr: { "stroke-dasharray": C, "stroke-dashoffset": C } });
        gsap.set(".halo", { attr: { "stroke-dasharray": C2, "stroke-dashoffset": -C2 } });
        gsap.set(".badge .disc", { scale: 0.82, opacity: 0 });
        gsap.set("#midLine i", { scaleY: 0 });
        gsap.set("#vs .v", { yPercent: -108 });
        gsap.set("#info .dot", { scale: 0, rotation: 45 });

        // ---- in: panel, then three beats (header + badges, the net line + VS, names + details)
        VM.panelIn(tl, 0, 1.0);

        tl.to("#kicker .rule", { scaleX: 1, duration: 0.8, ease: OUT }, 0.62)
          .to("#kTxt", { yPercent: 0, duration: 0.8, ease: OUT }, 0.66);

        tl.to("#teamL .disc", { scale: 1, opacity: 1, duration: 0.9, ease: OUT }, 0.80)
          .to("#teamR .disc", { scale: 1, opacity: 1, duration: 0.9, ease: OUT }, 0.90)
          .to("#teamL .ring", { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: OUT }, 0.84)
          .to("#teamR .ring", { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: OUT }, 0.94)
          .to(".halo", { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: OUT, stagger: 0.1 }, 0.95);

        tl.to("#midLine i", { scaleY: 1, duration: 0.7, ease: OUT }, 1.30)
          .to("#vs .v", { yPercent: 0, duration: 0.7, ease: OUT }, 1.40)
          .to("#vs .s", { yPercent: 0, duration: 0.7, ease: OUT }, 1.46);

        tl.to("#teamL .name span", { yPercent: 0, duration: 0.85, ease: OUT }, 1.66)
          .to("#teamR .name span", { yPercent: 0, duration: 0.85, ease: OUT }, 1.74)
          .to("#teamL .sub span", { yPercent: 0, duration: 0.8, ease: OUT }, 1.84)
          .to("#teamR .sub span", { yPercent: 0, duration: 0.8, ease: OUT }, 1.92);

        tl.to("#infoRule", { scaleX: 1, duration: 0.8, ease: OUT }, 2.16)
          .to("#info .mask > span", { yPercent: 0, duration: 0.7, ease: OUT, stagger: 0.08 }, 2.26)
          .to("#info .dot", { scale: 1, duration: 0.4, ease: OUT, stagger: 0.08 }, 2.34);
        // all landed by 3.12 s -> still frame

        // ---- out: text drops back behind its masks, then the panel carries everything off
        tl.to("#info .mask > span", { yPercent: 108, duration: 0.34, ease: IN, stagger: 0.03 }, EXIT)
          .to("#info .dot", { scale: 0, duration: 0.2, ease: IN }, EXIT)
          .to("#infoRule, #kicker .rule", { scaleX: 0, duration: 0.4, ease: IN }, EXIT)
          .to("#kTxt", { yPercent: 108, duration: 0.34, ease: IN }, EXIT)
          .to(".sub span", { yPercent: 108, duration: 0.34, ease: IN }, EXIT + 0.06)
          .to(".name span", { yPercent: 108, duration: 0.38, ease: IN }, EXIT + 0.10)
          .to("#vs .v", { yPercent: -108, duration: 0.34, ease: IN }, EXIT + 0.10)
          .to("#vs .s", { yPercent: 108, duration: 0.34, ease: IN }, EXIT + 0.10)
          .to("#midLine i", { scaleY: 0, duration: 0.34, ease: IN }, EXIT + 0.14);
        VM.panelOut(tl, EXIT + 0.30, 1.05);
        tl.to({}, { duration: 0.01 }, END - 0.01);

        tl.seek(0); window.__ready = true;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
    </script>
  </body>
</html>
